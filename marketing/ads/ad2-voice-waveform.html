<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ad 2 — Voice Waveform · 1080×1080</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* overflow:hidden on <body> would suppress page scroll entirely, so the canvas
     is clipped on a wrapper instead — the page itself can always scroll to reveal it. */
  html { background:#000; }
  body {
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  .stage {
    width:1080px; height:1080px;
    margin:0 auto;
    background:#06040f;
    overflow:hidden;
    position:relative;
  }

  /* Big radial background */
  .bg-radial {
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 52%, rgba(109,40,217,0.28) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 20%, rgba(34,211,238,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 30% 25% at 15% 80%, rgba(71,107,255,0.12) 0%, transparent 60%);
    animation:bgShift 8s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0%   { opacity:0.8; }
    100% { opacity:1; }
  }

  /* Ring rings around waveform */
  .ring {
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(109,40,217,0.2);
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    animation:ringPulse 3s ease-out infinite;
  }
  .ring:nth-child(1) { width:340px; height:340px; animation-delay:0s; }
  .ring:nth-child(2) { width:500px; height:500px; animation-delay:0.8s; }
  .ring:nth-child(3) { width:660px; height:660px; animation-delay:1.6s; }

  @keyframes ringPulse {
    0%   { opacity:0.5; transform:translate(-50%,-50%) scale(0.95); }
    50%  { opacity:0.2; }
    100% { opacity:0;   transform:translate(-50%,-50%) scale(1.05); }
  }

  /* Waveform container — centred vertically */
  .wave-wrap {
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    gap:7px;
    height:160px;
  }

  .bar {
    width:8px;
    border-radius:100px;
    background:linear-gradient(to top, #7c3aed, #22d3ee);
    animation:wave var(--dur, 1s) ease-in-out infinite alternate;
    animation-delay:var(--delay, 0s);
    height:var(--h, 30px);
    opacity:0.9;
  }

  @keyframes wave {
    0%   { transform:scaleY(0.35); opacity:0.7; }
    100% { transform:scaleY(1);    opacity:1; }
  }

  /* Top section */
  .top {
    position:absolute;
    top:0; left:0; right:0;
    padding:52px 60px 0;
    z-index:10;
  }
  .logo-row {
    display:flex; align-items:center; justify-content:space-between;
    opacity:0;
    animation:fadeIn 0.5s ease 0.1s forwards;
  }
  .logo {
    display:flex; align-items:center; gap:10px;
  }
  .logo-dot {
    width:11px; height:11px;
    background:#7c3aed;
    border-radius:50%;
    box-shadow:0 0 14px #7c3aed;
  }
  .logo-name {
    font-size:22px; font-weight:800;
    color:#fff; letter-spacing:-0.03em;
  }
  .tagline {
    font-size:14px; font-weight:600;
    color:#475569; letter-spacing:0.04em;
  }

  .headline {
    margin-top:52px;
    font-size:62px; font-weight:900;
    color:#fff; line-height:0.94;
    letter-spacing:-0.04em;
    opacity:0;
    animation:slideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.4s forwards;
  }
  .headline .cyan {
    background:linear-gradient(90deg, #22d3ee, #818cf8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  /* Pill tags floating above waveform */
  .pills {
    position:absolute;
    z-index:10;
    display:flex; gap:14px; flex-wrap:wrap;
    left:60px; right:60px;
    top:360px;
    opacity:0;
    animation:fadeIn 0.6s ease 1.0s forwards;
  }
  .pill {
    padding:10px 20px;
    border-radius:100px;
    font-size:16px; font-weight:700;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04);
    color:#94a3b8;
    backdrop-filter:blur(4px);
    white-space:nowrap;
  }
  .pill.active {
    background:rgba(124,58,237,0.18);
    border-color:rgba(124,58,237,0.35);
    color:#c4b5fd;
    animation:pillGlow 3s ease-in-out infinite;
  }
  @keyframes pillGlow {
    0%,100% { box-shadow:none; }
    50% { box-shadow:0 0 20px rgba(124,58,237,0.3); }
  }

  /* Bottom section */
  .bottom {
    position:absolute;
    bottom:0; left:0; right:0;
    z-index:10;
    padding:0 60px 52px;
  }

  .score-row {
    display:flex; gap:24px;
    margin-bottom:38px;
    opacity:0;
    animation:slideUp 0.6s cubic-bezier(0.22,1,0.36,1) 1.4s forwards;
  }
  .score-card {
    flex:1;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:20px 22px;
  }
  .score-label {
    font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.1em;
    color:#475569; margin-bottom:8px;
  }
  .score-value {
    font-size:36px; font-weight:900;
    letter-spacing:-0.04em;
  }
  .score-value.green { color:#34d399; }
  .score-value.blue  { color:#60a5fa; }
  .score-value.purple { color:#a78bfa; }
  .score-bar {
    margin-top:8px;
    height:4px; border-radius:100px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .score-fill {
    height:100%; border-radius:100px;
    animation:fillBar 1.2s cubic-bezier(0.22,1,0.36,1) 1.6s both;
  }
  .score-fill.green  { background:linear-gradient(90deg,#059669,#34d399); }
  .score-fill.blue   { background:linear-gradient(90deg,#1d4ed8,#60a5fa); }
  .score-fill.purple { background:linear-gradient(90deg,#6d28d9,#a78bfa); }
  @keyframes fillBar {
    from { width:0; }
  }

  .cta-row {
    display:flex; align-items:center; justify-content:space-between;
    opacity:0;
    animation:fadeIn 0.6s ease 2.0s forwards;
  }
  .cta-btn {
    display:inline-block;
    background:linear-gradient(135deg, #7c3aed, #0ea5e9);
    color:#fff;
    text-decoration:none;
    font-size:22px; font-weight:800;
    padding:22px 46px;
    border-radius:100px;
    letter-spacing:-0.01em;
    box-shadow:0 16px 50px rgba(124,58,237,0.45);
    animation:ctaGlow 2.5s ease-in-out 2.2s infinite;
  }
  @keyframes ctaGlow {
    0%,100% { box-shadow:0 16px 50px rgba(124,58,237,0.45); }
    50%      { box-shadow:0 20px 70px rgba(14,165,233,0.5); }
  }
  .cta-right {
    text-align:right;
  }
  .free-text {
    font-size:17px; font-weight:700; color:#a78bfa;
  }
  .url-text {
    font-size:13px; font-weight:500; color:#334155; margin-top:3px;
  }

  /* Keyframes shared */
  @keyframes fadeIn  { to { opacity:1; } }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(28px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg-radial"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>

  <!-- Waveform bars -->
  <div class="wave-wrap" id="wave"></div>

  <div class="top">
    <div class="logo-row">
      <div class="logo">
        <div class="logo-dot"></div>
        <span class="logo-name">RehearseAI</span>
      </div>
      <span class="tagline">AI-Powered Voice Coach</span>
    </div>
    <h1 class="headline">Your voice<br>deserves a<br><span class="cyan">real coach.</span></h1>
  </div>

  <div class="pills">
    <span class="pill active">Job Interviews</span>
    <span class="pill">Salary Negotiation</span>
    <span class="pill active">Public Speaking</span>
    <span class="pill">Thesis Defence</span>
    <span class="pill">Difficult Conversations</span>
    <span class="pill active">Sales Pitches</span>
  </div>

  <div class="bottom">
    <div class="score-row">
      <div class="score-card">
        <div class="score-label">Confidence</div>
        <div class="score-value green">87%</div>
        <div class="score-bar"><div class="score-fill green" style="width:87%"></div></div>
      </div>
      <div class="score-card">
        <div class="score-label">Clarity</div>
        <div class="score-value blue">91%</div>
        <div class="score-bar"><div class="score-fill blue" style="width:91%"></div></div>
      </div>
      <div class="score-card">
        <div class="score-label">Composure</div>
        <div class="score-value purple">78%</div>
        <div class="score-bar"><div class="score-fill purple" style="width:78%"></div></div>
      </div>
    </div>

    <div class="cta-row">
      <a class="cta-btn" href="https://rehearseai.dev/" target="_blank" rel="noopener">Try free — 5 sessions</a>
      <div class="cta-right">
        <div class="free-text">No subscription · Cancel anytime</div>
        <div class="url-text">rehearseai.dev</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Build waveform bars with random properties
  const wrap = document.getElementById('wave');
  const heights = [22,30,48,64,88,104,130,148,154,148,130,118,104,96,110,130,148,150,140,120,100,80,64,50,36,24,18,22,30,40];
  heights.forEach((h, i) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const dur = (0.6 + Math.random() * 0.7).toFixed(2);
    const delay = (Math.random() * 0.8).toFixed(2);
    bar.style.cssText = `--h:${h}px;height:${h}px;--dur:${dur}s;--delay:${delay}s;animation-delay:${delay}s;`;
    wrap.appendChild(bar);
  });
</script>
</body>
</html>
